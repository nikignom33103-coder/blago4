<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Инициализация администратора - Благо дарить!</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
        }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #065f46; margin-bottom: 10px; }
        .subtitle { color: #6b7280; margin-bottom: 20px; }
        button { padding: 12px 24px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: 600; font-size: 14px; }
        button:hover { background: #059669; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
        .status { margin: 20px 0; padding: 15px; border-radius: 6px; }
        .success { background: #c6f6d5; color: #22543d; border: 1px solid #86efac; }
        .error { background: #fed7d7; color: #c53030; border: 1px solid #fca5a5; }
        .info { background: #bfdbfe; color: #1e40af; border: 1px solid #93c5fd; }
        a { color: #10b981; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🟢 ИНИЦИАЛИЗАЦИЯ "Благо дарить!" v1.4.0</h1>
        <p class="subtitle">Создание учетной записи администратора</p>
        
        <div class="status info">
            <strong>ℹ️ Инструкция:</strong> Нажмите кнопку ниже чтобы создать учетную запись администратора. После этого вы сможете входить в систему и добавлять других пользователей.
        </div>
        
        <button onclick="initOnlyAdmin()">✅ СОЗДАТЬ АДМИНИСТРАТОРА</button>
        <button class="danger" onclick="clearData()">🗑️ ОЧИСТИТЬ БД</button>
        
        <div id="status"></div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwQ_gQ_K-s8l-s9H-mQ1k2L3m4N5o6P7q8",
            authDomain: "blago-a6270.firebaseapp.com",
            databaseURL: "https://blago-a6270-default-rtdb.firebaseio.com",
            projectId: "blago-a6270",
            storageBucket: "blago-a6270.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        let db = null;
        
        // ===== ИНИЦИАЛИЗАЦИЯ FIREBASE =====
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            console.log('✅ Firebase инициализирован');
        } catch (err) {
            console.error('❌ Ошибка Firebase:', err);
        }

        function showStatus(msg, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${msg}</div>`;
        }

        async function initOnlyAdmin() {
            if (!db) {
                showStatus('❌ БД не инициализирована. Перезагрузите страницу и попробуйте снова.', 'error');
                return;
            }
            
            showStatus('⏳ Создание администратора...', 'info');
            
            try {
                // Проверяем, есть ли уже пользователи
                const usersSnap = await db.ref('users').once('value');
                const existingUsers = usersSnap.val();

                if (existingUsers && Object.keys(existingUsers).length > 0) {
                    showStatus('⚠️ Администратор уже создан! Пользователи уже существуют в системе.', 'error');
                    const users = existingUsers;
                    let userList = '<strong>Текущие пользователи:</strong><br>';
                    for (let uid in users) {
                        userList += `• ${users[uid].name} (${users[uid].role})<br>`;
                    }
                    showStatus(userList, 'info');
                    return;
                }

                // Создаем только администратора
                const admin = {
                    '1769519370597': {
                        id: 1769519370597,
                        name: 'Никитин',
                        email: 'admin@blago.ru',
                        password: '1166',
                        role: 'admin',
                        active: true,
                        createdDate: new Date().toLocaleDateString('ru-RU')
                    }
                };

                await db.ref('users').set(admin);
                
                showStatus(`
                    ✅ <strong>АДМИНИСТРАТОР СОЗДАН!</strong><br><br>
                    <strong>Учетные данные:</strong><br>
                    👤 Имя: <strong>Никитин</strong><br>
                    🔐 Пароль: <strong>1166</strong><br><br>
                    <strong>Данные хранятся в Firebase:</strong><br>
                    📍 https://blago-a6270-default-rtdb.firebaseio.com<br><br>
                    ✅ Готово! Теперь вы можете:<br>
                    1️⃣ Войти в систему с этими данными<br>
                    2️⃣ Добавлять новых пользователей через админ-панель<br>
                    3️⃣ Использовать все 6 модулей системы<br><br>
                    👉 <a href="/blago4/">Перейти в приложение</a>
                `, 'success');

            } catch (err) {
                showStatus(`❌ Ошибка: ${err.message}`, 'error');
                console.error('Ошибка:', err);
            }
        }

        async function clearData() {
            if (!db) {
                showStatus('❌ БД не инициализирована. Перезагрузите страницу и попробуйте снова.', 'error');
                return;
            }
            
            if (!confirm('⚠️ ВНИМАНИЕ! Все данные системы будут безвозвратно удалены! Вы уверены?')) return;
            
            showStatus('⏳ Очистка базы данных...', 'info');
            try {
                await db.ref().set(null);
                showStatus('✅ БД очищена! Все данные удалены.', 'success');
            } catch (err) {
                showStatus(`❌ Ошибка: ${err.message}`, 'error');
            }
        }

        // Проверяем подключение при загрузке
        window.addEventListener('load', () => {
            if (db) {
                showStatus('✅ Firebase подключена | Проект: blago-a6270', 'success');
            } else {
                showStatus('⚠️ Firebase загружается, подождите...', 'info');
                setTimeout(() => {
                    if (db) {
                        showStatus('✅ Firebase подключена | Проект: blago-a6270', 'success');
                    } else {
                        showStatus('❌ Ошибка подключения к Firebase. Перезагрузите страницу.', 'error');
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
