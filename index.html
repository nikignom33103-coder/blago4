<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал "Благо дарить!" - Волонтерская помощь СВО</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/dashboard.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковое меню навигации -->
        <aside class="sidebar">
            <div class="logo">
                <h1>Благо дарить!</h1>
                <p class="tagline">Волонтерский портал</p>
            </div>
            <nav class="main-nav">
                <ul>
                    <li class="nav-item">
                        <a href="#dashboard" class="nav-link active" data-page="dashboard">
                            <span class="icon">📊</span>
                            <span>Дашборд</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#finance" class="nav-link" data-page="finance">
                            <span class="icon">💰</span>
                            <span>Финансы</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#trips" class="nav-link" data-page="trips">
                            <span class="icon">🚗</span>
                            <span>Рейсы</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#collections" class="nav-link" data-page="collections">
                            <span class="icon">🎯</span>
                            <span>Сборы & Заказы</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#warehouse" class="nav-link" data-page="warehouse">
                            <span class="icon">📦</span>
                            <span>Склад</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#presscenter" class="nav-link" data-page="presscenter">
                            <span class="icon">📢</span>
                            <span>Пресс-центр</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#thanksletter" class="nav-link" data-page="thanksletter">
                            <span class="icon">📜</span>
                            <span>Благодарства</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#crm" class="nav-link" data-page="crm">
                            <span class="icon">🤝</span>
                            <span>CRM Благ.</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#settings" class="nav-link" data-page="settings">
                            <span class="icon">⚙️</span>
                            <span>Справочники</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="user-section">
                <div class="user-info" id="userInfo">
                    <p class="user-name">Гость</p>
                    <button class="btn-logout" id="logoutBtn">Выход</button>
                </div>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Верхняя панель -->
            <header class="top-bar">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle">☰</button>
                    <h2 id="pageTitle">Дашборд</h2>
                </div>
                <div class="header-right">
                    <input type="text" class="search-box" placeholder="Поиск..." id="searchInput">
                    <div class="notifications">
                        <span class="notification-icon">🔔</span>
                    </div>
                </div>
            </header>

            <!-- Контентная область -->
            <div class="content-wrapper">
                <div id="pageContent">
                    <!-- Содержимое страниц загружается здесь -->
                </div>
            </div>
        </main>
    </div>

    <!-- Модальное окно для входа -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Вход в систему</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <p class="signup-link">Нет аккаунта? <a href="#" id="signupLink">Зарегистрироваться</a></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

    <!-- Основные скрипты -->
    <script src="src/js/config.js"></script>
    <script src="src/js/auth.js"></script>
    <script src="src/js/navigation.js"></script>
    <script src="src/js/app.js"></script>

    <!-- Модули приложения -->
    <script src="src/js/modules/dashboard.js"></script>
    <script src="src/js/modules/finance.js"></script>
    <script src="src/js/modules/trips.js"></script>
    <script src="src/js/modules/collections.js"></script>
    <script src="src/js/modules/warehouse.js"></script>
    <script src="src/js/modules/presscenter.js"></script>
    <script src="src/js/modules/thanksletter.js"></script>
    <script src="src/js/modules/crm.js"></script>
    <script src="src/js/modules/signature.js"></script>
    <script src="src/js/modules/settings.js"></script>
</body>
</html>
